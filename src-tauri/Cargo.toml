[package]
name = "schachtrainer"
version = "0.1.2"
description = "Schachpuzzle mit Spaced Repetition"
edition = "2021"
rust-version = "1.77"

[lib]
name = "schachtrainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"
# rustls statt native-tls: OpenSSL fuer Android querzukompilieren ist unnoetig muehsam.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
